<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#174f3b"><title>VideoQuest Deutsch</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header><div><div class="eyebrow">Deutsch aus echten Videos</div><h1>VideoQuest</h1></div><div class="stats"><span class="pill">⚡ <b id="xp">0</b> XP</span><span class="pill">❤️ <b id="hearts">3</b></span></div></header><div class="progress" aria-label="Fortschritt"><div id="bar"></div></div><section id="loading" class="card">Quest wird geladen …</section><section id="app" hidden><div class="hero card"><div><span class="tag" id="level"></span><h2 id="title"></h2><p id="summary"></p><a id="source" target="_blank" rel="noopener">▶ Originalvideo</a></div><div class="seal"><strong id="percent">0%</strong>geschafft</div></div><section class="card"><div class="step">1</div><h2>Lesen</h2><div id="article" class="article"></div><button id="read" class="primary">Gelesen · +10 XP</button></section><section class="card"><div class="step">2</div><h2>Verstehen</h2><div id="quiz"></div></section><section class="card"><div class="step">3</div><h2>Satzlabor</h2><div id="puzzles"></div></section><section class="card"><div class="step">4</div><h2>Wortschatz</h2><p>Tippe auf eine Karte, um die Bedeutung zu sehen.</p><div id="vocab" class="vocab"></div><button id="vocabDone" class="primary">Wörter gelernt · +10 XP</button></section><section id="finish" class="card finish" hidden><div class="trophy">🏆</div><h2>Quest geschafft!</h2><p id="finishText"></p><button id="reset" class="secondary">Noch einmal spielen</button></section></section></main><script type="module" src="app.js"></script></body></html>
